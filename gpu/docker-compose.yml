# ============================================================
# GPU Server Docker Compose — 51.15.140.134 (L4 24GB)
# ============================================================
# Ollama is already installed natively with qwen3:30b.
# This compose file is provided as an alternative if you ever
# want to run Ollama via Docker instead.
#
# Current setup (native Ollama):
#   - Ollama running on port 11434
#   - Model: qwen3:30b (~18GB VRAM)
#   - API: http://51.15.140.134:11434/api/chat
# ============================================================

version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: lokia-ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama_data:
