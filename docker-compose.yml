version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: lokia-db
    environment:
      POSTGRES_USER: lokia
      POSTGRES_PASSWORD: lokia
      POSTGRES_DB: lokia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lokia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lokia-backend
    environment:
      - DATABASE_URL=postgresql://lokia:lokia@db:5432/lokia
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-qwen-local}
      - LOCAL_MODEL_URL=${LOCAL_MODEL_URL:-http://51.15.140.134:8080/v1}
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
      - AI_TOP_P=${AI_TOP_P:-0.9}
      - AI_TOP_K=${AI_TOP_K:-20}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-4096}
      - AI_REPETITION_PENALTY=${AI_REPETITION_PENALTY:-1.05}
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT:-}
      - CORS_ORIGINS=["http://localhost:3000","http://54.38.243.146:3000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lokia-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://${VPS_HOST:-localhost}:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
