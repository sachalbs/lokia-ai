<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Platypus body -->
  <ellipse cx="25" cy="22" rx="14" ry="10" fill="currentColor" opacity="0.9"/>
  <!-- Platypus tail -->
  <ellipse cx="10" cy="24" rx="6" ry="4" fill="currentColor" opacity="0.7"/>
  <!-- Platypus beak -->
  <ellipse cx="42" cy="22" rx="8" ry="4" fill="currentColor" opacity="0.6"/>
  <!-- Eye -->
  <circle cx="32" cy="19" r="2" fill="white"/>
  <circle cx="32.5" cy="18.5" r="1" fill="currentColor"/>
  <!-- Text: LOKIA -->
  <text x="55" y="28" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="currentColor">LOKIA</text>
</svg>
